name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pruebas unitarias y de widgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Desarrollo

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Pruebas unitarias
        run: flutter test test/unit

      - name: Pruebas de widgets
        run: flutter test test/widget

      - name: Pruebas existentes del proyecto
        run: flutter test test/widget_test.dart test/project_activities_test.dart

  integration:
    name: Pruebas de integración (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Desarrollo

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Iniciar chromedriver
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          sleep 2

      - name: Pruebas de integración
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/app_test.dart \
            -d web-server --browser-name=chrome --headless
